[versions]
firebaseBom = "34.15.0"
junitJupiter = "6.1.1"
kotlin = "2.4.0"
androidCore = "1.19.0"
composeBom = "2026.06.01"
compose = "1.11.4"
activityCompose = "1.13.0"
lifecycleRuntimeCompose = "2.11.0"
lifecycleRuntime = "2.11.0"
material3 = "1.4.0"
navigationCompose = "2.9.8"
dataStore = "1.2.1"
timber = "5.0.1"
room = "2.8.4"
hilt = "2.60"
hiltNavigationCompose = "1.4.0"
kotlin-metadata-jvm = "2.4.0"
kotlinxSerializationJson = "1.11.0"
javaxInject = "1"
coroutinesCore = "1.11.0"
agp = "9.2.1"
junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
espresso-core = "3.7.0"
ksp = "2.3.9"
coil = "2.7.0"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]
#Android
android-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidCore" }
android-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
# Compose
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
#   Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-animation = { group = "androidx.compose.ui", name = "animation" }
#   Material 3
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
#   Compose Extras
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
compose-icons = { module = "androidx.compose.material:material-icons-extended-android", version = "1.7.8" }
# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-coompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin-metadata-jvm" }
# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesCore" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesCore" }
# Junit
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
# Tests
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
#
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
data-store = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
# Coil
coil-core = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

[bundles]
room-core = ["room-runtime", "room-ktx"]
hilt-core = ["hilt-android", "hilt-navigation-compose"]
coil = ["coil-core", "coil-compose"]

[plugins]
android-app = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.7" }
#   Build Logic
castorena-bl-compose-app = { id = "castorena.android.app.compose", version = "unespecific" }
castorena-bl-compose-lib = { id = "castorena.android.library.compose", version = "unespecific" }
castorena-bl-kotlin-lib = { id = "castorena.kotlin.library", version = "unespecific" }
castorena-bl-test-android = { id = "castorena.android.test", version = "unespecific" }
castorena-bl-test-unit = { id = "castorena.test", version = "unespecific" }
castorena-bl-serialization = { id = "castorena.serialization", version = "unespecific" }